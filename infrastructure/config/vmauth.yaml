# ============================================
# VMAUTH - API Key based multi-tenant routing
# API key IS the tenant ID
# ============================================
users:
  # Test API key - we'll generate real ones from backend later
  - username: "obs_test123"
    password: "obs_test123"
    url_map:
      - src_paths:
          - "/api/v1/write"
          - "/api/v1/import.*"
          - "/prometheus/api/v1/write"
          - "/insert/.*"
          - "/api/v1/import/prometheus"
          - "/api/v1/import/csv"
          - "/api/v1/import/jsonline"
        url_prefix: "http://vminsert:8480/insert/1/prometheus/"
      - src_paths:
          - "/api/v1/query.*"
          - "/api/v1/label.*"
          - "/api/v1/series.*"
          - "/api/v1/status.*"
          - "/select/.*"
          - "/api/v1/metadata.*"
          - "/prometheus/api/v1/query.*"
          - "/select/.*"
          - "/api/v1/.*"
        url_prefix: "http://vmselect:8481/select/1/prometheus/"
