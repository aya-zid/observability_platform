# ============================================
# LOKI CONFIGURATION - Multi-Tenant Enabled
# ============================================

auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
    instance_addr: 127.0.0.1

# ============================================
# INGESTER CONFIGURATION
# ============================================
ingester:
  max_chunk_age: 2h
  chunk_idle_period: 3m
  chunk_retain_period: 1m
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    num_tokens: 128
    heartbeat_timeout: 5m
    join_after: 0s

# ============================================
# STORAGE CONFIGURATION
# ============================================
storage_config:
  filesystem:
    directory: /loki/chunks
  
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
    cache_ttl: 24h


schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# ============================================
# LIMITS CONFIG
# ============================================
limits_config:
  ingestion_rate_mb: 256
  ingestion_burst_size_mb: 512
  max_streams_per_user: 10000
  max_line_size: 256kb
  max_entries_limit_per_query: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  retention_period: 0    # 0 = unlimited, logs kept forever
  
  # Promote OTLP resource attributes to stream labels for querying
  # This allows service_name, host_id, job, etc. to be used in {} stream selectors
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - host_id
            - host_name
            - service_name
            - job
            - os_type

# ============================================
# COMPACTOR
# ============================================
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  # Keep data indefinitely. Per-tenant retention was previously implemented
  # through Loki's delete API and is intentionally disabled.
  retention_enabled: false
  retention_delete_delay: 2h
  delete_request_store: filesystem

# ============================================
# QUERY FRONTEND
# ============================================
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100
        ttl: 1h

frontend:
  max_outstanding_per_tenant: 2048
# ============================================
# QUERIER CONFIGURATION
# ============================================
querier:
  max_concurrent: 40
  query_ingesters_within: 0
