# Grafana Datasource Provisioning
# Auto-configures connections when Grafana starts

apiVersion: 1
datasources:
  # ============================================
  # VictoriaMetrics Cluster (via vmselect or vmauth)
  # ============================================
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    # Option A: Direct to vmselect (single tenant view)
    url: http://vmselect:8481/select/1/prometheus
    
    # Option B: Through vmauth (enables tenant switching via headers)
    #url: http://vmauth:8427/select/1/prometheus
    
    isDefault: true
    editable: true
    #jsonData:
      # For multi-tenant: we can add custom headers per datasource
     # httpHeaderName1: 'Authorization'
    #secureJsonData:
      # Basic auth for tenant-1 (base64 encoded)
     # httpHeaderValue1: 'Basic dGVuYW50LTE6Y2hhbmdlbWUtdGVuYW50LTE='

  # ---------------------------------------
  # 2. Loki (Logs) 
  #    Built-in Grafana datasource
  # ----------------------------------------
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      # Enable for better query performance
      maxLines: 1000
      # For multi-tenant: we will set headers dynamically via API
      # or create multiple datasources per tenant
      httpHeaderName1: 'X-Scope-OrgID'
    secureJsonData:
      # Default tenant for initial setup
      # In production, our SaaS backend injects this per-user
      httpHeaderValue1: 'obs_test123'
  # ----------------------------------------
  # 3. Tempo (Traces)
  # Built-in Grafana datasource
  # ----------------------------------------
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpHeaderName1: 'X-Scope-OrgID'
    secureJsonData:
      httpHeaderValue1: 'default-tenant'
