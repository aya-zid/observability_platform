# Grafana Datasource Provisioning
# Auto-configures connections when Grafana starts

apiVersion: 1
datasources:
  # ============================================
  # VictoriaMetrics Cluster (via vmselect)
  # ============================================
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://vmselect:8481/select/tenant_id_change_me/prometheus # for now this is manualy set but gonna update it soon
    isDefault: true
    editable: true
    
  # ---------------------------------------
  # 2. Loki (Logs) 
  #    Built-in Grafana datasource
  # ----------------------------------------
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      # Enable for better query performance
      maxLines: 1000
      httpHeaderName1: 'X-Scope-OrgID'
    secureJsonData:
      httpHeaderValue1: 'tenant uuid change me'  #for now this is manualy set but gonna update it soon
  # ----------------------------------------
  # 3. Tempo (Traces)
  # Built-in Grafana datasource
  # ----------------------------------------
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpHeaderName1: 'X-Scope-OrgID'
    secureJsonData:
      httpHeaderValue1: 'tenant uuid change me'  #for now this is manualy set but gonna update it soon