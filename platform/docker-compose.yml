# ============================================
# PLATFORM STACK - Backend + Data Layer
# ============================================
networks:
  obs-network:
    external: true
  obs-platform-internal:
    driver: bridge

services:

  postgres:
    image: postgres:16-alpine
    container_name: obs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: obs_saas_dev
      POSTGRES_USER: obsuser
      POSTGRES_PASSWORD: pass1234
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - obs-platform-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obsuser -d obs_saas_dev"]
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: obs-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    networks:
      - obs-platform-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: obs-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # ── Database ───────────────────────────────────────────────
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: obsuser
      DB_PASSWORD: pass1234
      DB_NAME: obs_saas_dev
      DB_SSLMODE: disable

      # ── Auth ───────────────────────────────────────────────────
      JWT_SECRET: super-secret-change-me-in-prod-32-chars-min
      REFRESH_TOKEN_PEPPER: dev-refresh-token-pepper-32-chars-minimum!!

      # ── Redis ──────────────────────────────────────────────────
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      # ── Infra addresses (docker-internal, never exposed to agents) ─
      VMINSERT_HOST: vminsert
      VMINSERT_PORT: 8480
      VMSELECT_HOST: vmselect
      VMSELECT_PORT: 8481
      LOKI_HOST: loki
      LOKI_PORT: 3100
      TEMPO_HOST: tempo
      TEMPO_PORT: 4318
      AGENT_INSTALL_SCRIPT_PATH: /opt/agent/install.sh

      # ── Grafana public URL (must be reachable FROM THE BROWSER) ──
      # This is returned to the frontend as-is so it must use the host's
      # IP or hostname — not the docker service name "grafana".
      # Change to your machine's actual IP if accessing from another device.
      GRAFANA_URL: http://localhost:3000

    networks:
      - obs-network
      - obs-platform-internal
    volumes:
      - ../agent:/opt/agent:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: obs-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
    depends_on:
      - backend

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      target: dev
    container_name: obs-admin-frontend
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      NODE_ENV: development
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: obs-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    networks:
      - obs-platform-internal
    depends_on:
      - postgres
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  postgres-data:
  pgadmin-data:
