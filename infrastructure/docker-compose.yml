# ============================================
# OBSERVABILITY STACK - Infrastructure Layer
# ============================================
# Network topology:
#   obs-network (external) — shared with platform stack
#   All services are reachable by service name from the backend:
#     vminsert:8480, vmselect:8481, loki:3100, tempo:4318
#
# tenant routing is now handled by the Go backend proxy 
# ============================================

networks:
  obs-network:
    external: true   # created once with: docker network create obs-network

services:

  # ============================================
  # VICTORIAMETRICS CLUSTER
  # ============================================

  vmstorage:
    image: victoriametrics/vmstorage:v1.136.0-cluster
    container_name: vmstorage
    restart: unless-stopped
    volumes:
      - vmstorage-data:/storage
    command:
      - '--storageDataPath=/storage'
      - '--retentionPeriod=30d'
      - '--httpListenAddr=:8482'
      - '--vminsertAddr=:8400'
      - '--vmselectAddr=:8401'
    ports:
      - "8482:8482"   # monitoring only — not used by backend
    networks:
      - obs-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8482/health 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  vminsert:
    image: victoriametrics/vminsert:v1.136.0-cluster
    container_name: vminsert
    restart: unless-stopped
    command:
      - '--storageNode=vmstorage:8400'
    ports:
      - "8480:8480"   # exposed for local debugging only
    networks:
      - obs-network
    depends_on:
      vmstorage:
        condition: service_healthy

  vmselect:
    image: victoriametrics/vmselect:v1.136.0-cluster
    container_name: vmselect
    restart: unless-stopped
    command:
      - '--storageNode=vmstorage:8401'
    ports:
      - "8481:8481"   # exposed for local debugging only
    networks:
      - obs-network
    depends_on:
      vmstorage:
        condition: service_healthy

  # ============================================
  # LOKI - Log storage
  # Tenant isolation: X-Scope-OrgID injected by Go backend
  # ============================================
  loki:
    image: grafana/loki:3.6.0
    container_name: loki
    restart: unless-stopped
    volumes:
      - ./config/loki.yaml:/etc/loki/local-config.yaml:ro
      - ./data/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"   # exposed for local debugging only
    networks:
      - obs-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3100/ready || exit 1"]   
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================
  # TEMPO - Distributed tracing
  # Tenant isolation: X-Scope-OrgID injected by Go backend
  # Port mapping explanation:
  #   4318 (internal) = OTLP HTTP — backend proxies to this
  #   4317 (internal) = OTLP gRPC — available if needed
  #   3200 (exposed)  = Tempo HTTP API + Grafana queries
  # ============================================
  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    restart: unless-stopped
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"   # Tempo API — needed by Grafana
      # 4317/4318 are NOT exposed — backend reaches them via internal network only
    networks:
      - obs-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================
  # GRAFANA - Visualization (for internal use / admin)
  # ============================================
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # Disable auth for embedding in frontend later
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    networks:
      - obs-network
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_healthy
      vmselect:
        condition: service_started

volumes:
  vmstorage-data:
  tempo-data:
  grafana-data:
